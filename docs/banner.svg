<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="GuardCart: your AI can shop. It just can't cheat.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000f2e"/>
      <stop offset="0.55" stop-color="#002a78"/>
      <stop offset="1" stop-color="#0064d2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#3ea6ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3ea6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cc8ff"/>
      <stop offset="1" stop-color="#1a6dff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000814" flood-opacity="0.55"/>
    </filter>
    <style>
      .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'Cascadia Code', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
      .blocked { animation: pulse 2.4s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="420" rx="24" fill="url(#glow)"/>

  <!-- Left: brand -->
  <g transform="translate(72 92)">
    <path d="M36 0 L70 12 V40 C70 62 56 78 36 88 C16 78 2 62 2 40 V12 Z" fill="url(#shield)"/>
    <path d="M36 0 L70 12 V40 C70 62 56 78 36 88 Z" fill="#ffffff" fill-opacity="0.18"/>
    <path d="M22 44 L32 54 L52 32" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="96" y="64" class="sans" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1.5">GuardCart</text>
  </g>

  <text x="72" y="238" class="sans" font-size="34" font-weight="700" fill="#ffffff">Your AI can shop.</text>
  <text x="72" y="282" class="sans" font-size="34" font-weight="700" fill="#ffc439">It just can't cheat.</text>

  <text x="72" y="326" class="sans" font-size="17" fill="#c9dcff">An AI shopping agent with spending rules enforced in code,</text>
  <text x="72" y="350" class="sans" font-size="17" fill="#c9dcff">and payments that only move when you approve in PayPal.</text>

  <!-- Right: agent activity card -->
  <g transform="translate(700 52)">
    <rect width="512" height="316" rx="18" fill="#ffffff" filter="url(#shadow)"/>
    <path d="M18 0 H494 A18 18 0 0 1 512 18 V44 H0 V18 A18 18 0 0 1 18 0 Z" fill="#f1f5fb"/>
    <circle cx="24" cy="22" r="6" fill="#ff5f57"/>
    <circle cx="44" cy="22" r="6" fill="#febc2e"/>
    <circle cx="64" cy="22" r="6" fill="#28c840"/>
    <text x="256" y="27" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#5b6b84">agent activity · budget $150</text>

    <!-- search -->
    <g transform="translate(20 62)">
      <g class="r1">
        <rect width="472" height="38" rx="9" fill="#f6f8fb" stroke="#e3e8f0"/>
        <circle cx="20" cy="17" r="6" fill="none" stroke="#2f6fed" stroke-width="2.4"/>
        <path d="M24.5 21.5 L29 26" stroke="#2f6fed" stroke-width="2.4" stroke-linecap="round"/>
        <text x="40" y="24" class="mono" font-size="13.5" fill="#1d2a3f">search_products("2 person tent")</text>
        <text x="456" y="24" text-anchor="end" class="sans" font-size="12.5" fill="#7a8aa3">3 results</text>
      </g>
    </g>

    <!-- blocked: per-item cap -->
    <g transform="translate(20 108)">
      <g class="r2">
        <g class="blocked">
          <rect width="472" height="50" rx="9" fill="#fff1f2" stroke="#fecdd3"/>
          <path d="M20 9 L31 13 V21 C31 28 26 33 20 36 C14 33 9 28 9 21 V13 Z" fill="#e11d48"/>
          <text x="40" y="22" class="sans" font-size="13" font-weight="800" fill="#be123c" letter-spacing="0.6">BLOCKED</text>
          <text x="112" y="22" class="mono" font-size="13" fill="#9f1239">add_to_cart(Ridgeline tent)</text>
          <text x="40" y="40" class="sans" font-size="12.5" fill="#be123c">$129.00 exceeds your per-item limit of $100.00</text>
        </g>
      </g>
    </g>

    <!-- blocked: budget -->
    <g transform="translate(20 166)">
      <g class="r3">
        <g class="blocked">
          <rect width="472" height="50" rx="9" fill="#fff1f2" stroke="#fecdd3"/>
          <path d="M20 9 L31 13 V21 C31 28 26 33 20 36 C14 33 9 28 9 21 V13 Z" fill="#e11d48"/>
          <text x="40" y="22" class="sans" font-size="13" font-weight="800" fill="#be123c" letter-spacing="0.6">BLOCKED</text>
          <text x="112" y="22" class="mono" font-size="13" fill="#9f1239">add_to_cart(2 × down bags)</text>
          <text x="40" y="40" class="sans" font-size="12.5" fill="#be123c">Cart total $178.00 exceeds your budget of $150.00</text>
        </g>
      </g>
    </g>

    <!-- quote -->
    <g transform="translate(20 224)">
      <g class="r4">
        <rect width="472" height="32" rx="9" fill="#f0fdf4" stroke="#bbf7d0"/>
        <path d="M13 16 L18 21 L27 11" fill="none" stroke="#16a34a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="40" y="21" class="mono" font-size="13" fill="#166534">quote_cart(eco kit) → $233.50 · asks you first</text>
      </g>
    </g>

    <!-- paypal -->
    <g transform="translate(20 266)">
      <g class="r5">
        <rect width="230" height="36" rx="18" fill="#ffc439"/>
        <text x="58" y="24" class="sans" font-size="15" font-weight="600" fill="#1d2a3f">Pay with</text>
        <text x="128" y="24" class="sans" font-size="16" font-weight="800" font-style="italic" fill="#003087">Pay<tspan fill="#009cde">Pal</tspan></text>
        <text x="248" y="23" class="sans" font-size="12.5" fill="#5b6b84">only you can press this</text>
      </g>
    </g>
  </g>
</svg>
